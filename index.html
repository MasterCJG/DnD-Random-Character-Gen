<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2a2118;--mute:#7a6b58;--acc:#8c2f1f;--line:#e2d7c3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#221c16;--ink:#f0e6d4;--mute:#a8987f;--acc:#e0705a;--line:#3a3025;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--card:#221c16;--ink:#f0e6d4;--mute:#a8987f;--acc:#e0705a;--line:#3a3025;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,'Times New Roman',serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 12px;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
select,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
select{flex:1;min-width:100px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:bold;flex:1}
button{cursor:pointer}
h2{font-size:1.4rem;margin:0}
.sub{color:var(--mute);margin:2px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px 4px}
.stat b{display:block;font-size:1.5rem}
.stat small{color:var(--mute);letter-spacing:.05em}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}
.kv span{color:var(--mute)}
h3{margin:0 0 8px;font-size:1rem;color:var(--acc)}
.list{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:.95rem}
.list div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0}
.on{font-weight:bold}
.on::before{content:"● ";color:var(--acc)}
.note{color:var(--mute);font-size:.85rem}
#msg{min-height:1.2em;margin-top:8px;font-size:.9rem;color:var(--acc)}
textarea{position:absolute;left:-9999px}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#pop[hidden]{display:none}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:360px;text-align:center}
.big{font-size:3rem;font-weight:bold;color:var(--acc);line-height:1.1}
.crit{color:var(--acc);font-weight:bold}
[data-r]{cursor:pointer}
a[data-r]{color:var(--acc);text-decoration:underline dotted}
ul{margin:0;padding-left:20px}
</style>
</head>
<body>
<main>
<h1>⚔️ 5e Character Roller</h1>
<div class="card">
<div class="row">
<select id="selR"></select><select id="selC"></select>
</div>
<div class="row" style="margin-top:8px">
<select id="selL"></select>
<button class="p" id="roll">🎲 Roll Character</button>
</div>
</div>
<p class="note">Tap any modifier, attack bonus, damage or spell to roll it.</p>
<div id="sheet"></div>
<div class="card" id="exp" style="display:none">
<h3>Export to Google Sheets</h3>
<div class="row">
<button class="p" id="copy">Copy for Sheets</button>
<a href="https://sheets.new" target="_blank" rel="noopener"><button type="button">Open new Sheet ↗</button></a>
</div>
<div id="msg"></div>
<p class="note">Copy, open a blank Sheet, click cell A1 and paste. Each ability, save and skill lands in its own cell.</p>
</div>
<div id="pop" hidden><div class="pc"><h3 id="pt"></h3><div id="pb2"></div><div class="row" style="margin-top:12px"><button class="p" id="again">Roll again</button><button id="close">Close</button></div></div></div>

function featHtml(x){

let LAST=null;
function rollDmg(s){
  let mult=1,m;
  if(m=s.match(/^(\d+)\u00d7/)){mult=+m[1];s=s.replace(/^\d+\u00d7/,'')}
  if(m=s.match(/\u00d7(\d+) beams/)){mult=+m[1];s=s.replace(/ \u00d7\d+ beams/,'')}
  let tot=0;const parts=[];
  for(let i=0;i<mult;i++){
    const re=/(\d+)d(\d+)|[+-]\d+(?!\d*d)/g;let g,sub=[];
    while(g=re.exec(s)){
      if(g[1]){const rs=Array.from({length:+g[1]},()=>d(+g[2]));tot+=rs.reduce((a,b)=>a+b,0);sub.push(g[1]+'d'+g[2]+' ['+rs.join(', ')+']')}
      else{tot+=+g[0];sub.push(g[0])}
    }
    parts.push((mult>1?'Roll '+(i+1)+': ':'')+sub.join(' '));
  }
  return{tot:Math.max(0,tot),parts};
}
function doRoll(el){
  LAST=el;const k=el.dataset.r,l=el.dataset.l,v=el.dataset.v;let h;
  if(k==='dmg'){const r=rollDmg(v);h='<div class="big">'+r.tot+'</div><p>'+r.parts.join('<br>')+'</p><p class="note">'+v+'</p>'}
  else{const m=+v,n=d(20),t=n+m;h='<div class="big">'+t+'</div><p>d20: <b>'+n+'</b> '+sg(m)+' = <b>'+t+'</b></p>'+(n===20?'<p class="crit">Natural 20!</p>':n===1?'<p class="crit">Natural 1</p>':'')}
  $('pt').textContent=l;$('pb2').innerHTML=h;$('pop').hidden=false;
}

}

function spells(x){
  const cl=x.cls,L=SPL[cl];if(!L)return null;

  else{const eff=half?(lvl<2?0:Math.ceil(lvl/2)):lvl;sl=eff?FS[eff-1]:[]}
  if(!sl.length)return null;
  const lists=L.split('|').map(s=>s?s.split(','):[]);
  const cm=x.m[CA[cl]];
  const n=cl==='Bard'?Math.min(22,lvl+3):cl==='Sorcerer'||cl==='Warlock'?Math.min(15,lvl+1):cl==='Paladin'?Math.max(1,Math.floor(lvl/2)+cm):cl==='Ranger'?Math.min(11,Math.ceil(lvl/2)+1):Math.max(1,lvl+cm);

  const nc=CB[cl]?CB[cl]+(lvl>=4)+(lvl>=10):0;
  return{sl,cant:shuffle(lists[0]).slice(0,nc),by,label:cl==='Bard'||cl==='Sorcerer'||cl==='Warlock'||cl==='Ranger'?'known':cl==='Wizard'?'spellbook picks':'prepared'};
}

    if(q.cant.length)h+='<p><b>Cantrips:</b> '+q.cant.map(spHtml).join(', ')+'</p>';
    Object.keys(q.by).forEach(i=>h+='<p><b>'+OR[i-1]+':</b> '+q.by[i].map(spHtml).join(', ')+'</p>');
    h+='<p class="note">Randomly chosen ('+q.label+'). Warlock Mystic Arcanum and subclass spells are not included.</p></div>';
  }
  return h;
}
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const d=n=>1+Math.floor(Math.random()*n);
const mod=s=>Math.floor((s-10)/2);
const sg=n=>(n>=0?'+':'')+n;
function roll4(){const r=[d(6),d(6),d(6),d(6)].sort((a,b)=>a-b);return r[1]+r[2]+r[3]}

function opt(sel,label,items){sel.innerHTML='<option value="">'+label+'</option>'+items.map(i=>'<option>'+i+'</option>').join('')}
opt($('selR'),'Random race',Object.keys(R));
opt($('selC'),'Random class',Object.keys(C));
$('selL').innerHTML=Array.from({length:20},(_,i)=>'<option value="'+(i+1)+'">Level '+(i+1)+'</option>').join('');

let CH=null;
function gen(){
  const race=$('selR').value||pick(Object.keys(R));
  const cls=$('selC').value||pick(Object.keys(C));
  const lvl=+$('selL').value;
  const rc=R[race],c=C[cls];
  const order=c.p.split(' ');
  const rolls=Array.from({length:6},roll4).sort((a,b)=>b-a);
  const sc={};order.forEach((a,i)=>sc[a]=rolls[i]);
  const bonus={};
  if(rc.all)AB.forEach(a=>bonus[a]=1);
  if(rc.b)Object.assign(bonus,rc.b);
  if(rc.two)shuffle(AB.filter(a=>!bonus[a])).slice(0,2).forEach(a=>bonus[a]=1);
  AB.forEach(a=>sc[a]=Math.min(20,sc[a]+(bonus[a]||0)));
  let asi=[4,8,12,16,19].filter(l=>l<=lvl).length*2;
  for(let i=0;i<order.length&&asi>0;i++){const a=order[i],g=Math.min(asi,20-sc[a]);sc[a]+=g;asi-=g}
  const m={};AB.forEach(a=>m[a]=mod(sc[a]));
  const pb=2+Math.floor((lvl-1)/4);
  const bgName=pick(Object.keys(BG));
  const prof=new Set(BG[bgName]);
  const pool=(c.k?c.k.split(','):ALLSK).filter(s=>!prof.has(s));
  shuffle(pool).slice(0,c.n).forEach(s=>prof.add(s));
  const saves=c.s.split(' ');
  const hp=c.hd+m.CON+(lvl-1)*((c.hd/2+1)+m.CON);
  CH={name:pick(FN)+' '+pick(LN),race,cls,lvl,bg:bgName,al:pick(AL),sc,m,pb,prof,saves,
    hp:Math.max(lvl,Math.round(hp)),hd:lvl+'d'+c.hd,ac:c.ac(m),init:m.DEX,sp:rc.sp,
    pp:10+m.WIS+(prof.has('Perception')?pb:0)};
  extra(CH);
  render();
}

function render(){
  const x=CH;
  const stats=AB.map(a=>'<div class="stat" data-r="chk" data-l="'+a+' check" data-v="'+x.m[a]+'"><small>'+a+'</small><b>'+x.sc[a]+'</b>'+sg(x.m[a])+'</div>').join('');
  const sv=AB.map(a=>{const on=x.saves.includes(a);return '<div class="'+(on?'on':'')+'" data-r="chk" data-l="'+a+' saving throw" data-v="'+(x.m[a]+(on?x.pb:0))+'"><span>'+a+'</span><span>'+sg(x.m[a]+(on?x.pb:0))+'</span></div>'}).join('');
  const sk=ALLSK.map(s=>{const on=x.prof.has(s);return '<div class="'+(on?'on':'')+'" data-r="chk" data-l="'+s+' check" data-v="'+(x.m[AB[SK[s]]]+(on?x.pb:0))+'"><span>'+s+' <small>('+AB[SK[s]]+')</small></span><span>'+sg(x.m[AB[SK[s]]]+(on?x.pb:0))+'</span></div>'}).join('');
  $('sheet').innerHTML='<div class="card"><h2>'+x.name+'</h2><p class="sub">Level '+x.lvl+' '+x.race+' '+x.cls+' · '+x.bg+' · '+x.al+'</p>'+(x.subTxt?'<p class="sub">'+x.subTxt+'</p>':'')+
  '</div>'+
  '<div class="card"><h3>Combat</h3><div class="stats">'+combatHtml(x)+'</div></div>'+
  '<div class="card"><h3>Ability Scores</h3><div class="stats">'+stats+'</div></div>'+
  '<div class="card"><h3>Saving Throws</h3><div class="list">'+sv+'</div></div>'+
  '<div class="card"><h3>Skills</h3><div class="list">'+sk+'</div><p class="note">● = proficient. Stats use 4d6 drop lowest, assigned by class priority; ability score improvements are applied to your primary stats. AC assumes typical starting armor.</p></div>';
  $('sheet').innerHTML+=extraHtml(x)+featHtml(x);$('exp').style.display='block';$('msg').textContent='';
}

function tsv(){
  const x=CH,r=[];
  r.push(['Name',x.name,'Race',x.race,'Class',x.cls,'Level',x.lvl]);
  r.push(['Background',x.bg,'Alignment',x.al,'Proficiency',x.pb,'Speed',x.sp]);
  r.push(['HP',x.hp,'AC',x.ac,'Initiative',x.init,'Hit Dice',x.hd]);
  r.push([]);
  r.push(['Ability','Score','Modifier','Save','Save Prof']);
  AB.forEach(a=>{const on=x.saves.includes(a);r.push([a,x.sc[a],x.m[a],x.m[a]+(on?x.pb:0),on?'Yes':'No'])});
  r.push([]);
  r.push(['Skill','Ability','Bonus','Proficient']);
  ALLSK.forEach(s=>{const on=x.prof.has(s),a=AB[SK[s]];r.push([s,a,x.m[a]+(on?x.pb:0),on?'Yes':'No'])});
  r.push([]);r.push(['Passive Perception',x.pp]);
  r.push([]);r.push(['Gender',x.gender,'Age',x.age,'Height',x.height,'Weight',x.weight]);
  r.push(['Eyes',x.eyes,'Hair',x.hair,'Skin',x.skin,'Faith',x.faith]);
  r.push(['Background Description',x.desc]);if(x.sub)r.push(['Subclass',x.sub]);
  r.push([]);r.push(['Attack','To Hit','Damage']);x.atk.forEach(a=>r.push([a.n,a.hit,a.dmg]));
  if(x.sa!=null)r.push(['Spell Attack',x.sa,'Spell Save DC',x.dc]);
  r.push(['Traits',x.traits.join(' ')]);r.push(['Ideal',x.ideal]);r.push(['Bond',x.bond]);r.push(['Flaw',x.flaw]);
  r.push([]);r.push(['Equipment',x.kit.join('; ')]);r.push(['Background Gear',x.bgItem]);r.push(['Alt Starting Gold (gp)',x.gold]);
  const q=x.spl;
  if(q){r.push([]);r.push(['Spell Slots',q.sl.map((n,i)=>n?OR[i]+' x'+n:'').filter(Boolean).join(', ')]);
    if(q.cant.length)r.push(['Cantrips',q.cant.join(', ')]);
    Object.keys(q.by).forEach(i=>r.push([OR[i-1]+' Level',q.by[i].join(', ')]))}
  return r.map(a=>a.join('\t')).join('\n');
}
async function copy(){
  const t=tsv();let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
  if(!ok){try{const ta=$('ta');ta.value=t;ta.select();ok=document.execCommand('copy')}catch(e){}}
  $('msg').textContent=ok?'Copied. Now open a blank Sheet and paste into A1.':'Copy was blocked here. Try again from the page’s own tab.';
}
$('roll').onclick=gen;$('copy').onclick=copy;
gen();
</script>
